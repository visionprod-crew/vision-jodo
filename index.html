<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#141415">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="VISION 조감도">
<meta name="mobile-web-app-capable" content="yes">
<title>VISION 촬영 조감도 메이커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c1c1e;--panel:#262628;--panel2:#2f2f32;--field:#1d1d1f;--line:#3a3a3e;--text:#ececee;--muted:#9b9ba2;--acc:#EE6C1A;--acc2:#ff8a3d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:#5c5c62;background:#38383c}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
button.primary:hover{background:var(--acc2)}
input[type=text],input[type=number],textarea,select{width:100%;font:inherit;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:5px;padding:5px 7px;outline:none}
textarea{resize:vertical;min-height:44px}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--line);border-radius:5px;background:none;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=checkbox]{accent-color:var(--acc)}
#top{height:50px;display:flex;align-items:center;gap:6px;padding:0 12px;background:#141415;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;margin-right:10px;font-weight:700;letter-spacing:-.01em}
.brand img{height:17px}
.brand span{color:var(--muted);font-weight:500;font-size:12px}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.grow{flex:1}
#zoomv{min-width:52px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
#app{position:absolute;top:50px;bottom:0;left:0;right:0;display:grid;grid-template-columns:372px 46px 1fr 290px}
#left,#right{background:var(--panel);overflow-y:auto}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line)}
#tools{background:#212123;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:3px}
.tool{width:36px;height:36px;padding:0;display:grid;place-items:center;background:transparent;border-color:transparent;position:relative;color:#cfcfd4}
.tool.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tool svg{width:18px;height:18px}
.tool .k{position:absolute;right:3px;bottom:1px;font-size:9px;color:#77777d}
.tool.on .k{color:#ffe1cc}
.tsep{width:24px;height:1px;background:var(--line);margin:5px 0}
#vp{position:relative;overflow:hidden;background:#3b3b3f}
#stage{position:absolute;top:34px;left:0;right:0;bottom:0;width:100%;height:calc(100% - 34px);display:block;touch-action:none;user-select:none}
#tabs{position:absolute;top:0;left:0;right:0;height:34px;background:#29292c;border-bottom:1px solid #18181a;display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden;z-index:2;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:4px;padding:0 14px 0 6px;max-width:300px;min-width:120px;border-right:1px solid #1c1c1e;color:#a2a2a8;cursor:pointer;font-size:12.5px;white-space:nowrap;user-select:none;flex-shrink:0}
.tab:hover{background:#313134}
.tab.on{background:#3b3b3f;color:#fff;font-weight:600}
.tab span{overflow:hidden;text-overflow:ellipsis}
.tab .tx{padding:2px 5px;background:transparent;border:0;color:inherit;opacity:.65;font-size:12px;border-radius:4px}
.tab .tx:hover{opacity:1;background:#4a4a4f}
.tadd{background:transparent;border:0;color:#a2a2a8;padding:0 14px;font-size:17px;border-radius:0;flex-shrink:0}
.tadd:hover{color:#fff;background:#313134}
.trec{margin:5px 8px;padding:0 10px;font-size:12px;border-color:var(--acc);color:var(--acc2);background:rgba(238,108,26,.08);flex-shrink:0}
.trec b{margin-left:6px;color:#888;font-weight:400}
#vp.dropping::after{content:'여기에 놓기';position:absolute;inset:10px;border:2px dashed var(--acc);border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;pointer-events:none;background:rgba(238,108,26,.08)}
.sec{padding:14px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 10px;font-size:11px;letter-spacing:.07em;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.sec h3 small{letter-spacing:0;font-weight:500}
.row{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:8px;margin-bottom:7px}
.row>label:first-child{color:var(--muted);font-size:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:7px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:7px}
.fld{position:relative}
.fld span{position:absolute;left:7px;top:50%;transform:translateY(-50%);font-size:10px;color:#77777d;pointer-events:none}
.fld input{padding-left:20px}
.crow{display:flex;align-items:center;gap:8px}
.crow label{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:12px}
.hint{color:var(--muted);font-size:11.5px;line-height:1.5}
/* cams */
.cam{background:var(--panel2);border:1px solid var(--line);border-radius:9px;margin-bottom:10px;transition:border-color .15s}
.cam.hl{border-color:var(--acc)}
.cam-head{display:grid;grid-template-columns:108px 1fr 96px;gap:6px;padding:9px 9px 7px}
.cam-no{font-weight:700;color:var(--acc2);padding:5px 4px}
.cam-title{font-weight:700}
.cam-op{color:var(--acc2)}
.items{list-style:none;margin:0;padding:0 9px}
.items li{display:grid;grid-template-columns:16px 90px 1fr 22px;align-items:center;gap:3px;margin-bottom:3px;border-radius:5px}
.items li.over{box-shadow:0 -2px 0 var(--acc)}
.items input{padding:4px 6px;background:#252527;border-color:#333337}
.items select.cat{padding:4px 3px;font-size:11px;font-weight:700;letter-spacing:.02em;background:#252527;border-color:#333337;color:var(--cc,#ccc);cursor:pointer}
.h{cursor:grab;color:#5f5f66;font-size:11px;user-select:none;text-align:center;letter-spacing:-2px}
.ib{padding:2px 5px;background:transparent;border-color:transparent;color:var(--muted);line-height:1}
.ib:hover{color:#fff;background:#3a3a3e}
.ib.del:hover{color:#ff6b6b}
.cam-foot{display:flex;align-items:center;justify-content:space-between;padding:4px 9px 9px;gap:6px}
.cam-link{display:flex;align-items:center;gap:3px;padding:0 9px 7px;font-size:11.5px;color:var(--muted)}
.cam-link .lk{flex:1;display:flex;align-items:center;gap:6px}
.cam-link .lk.on{color:#7fdc9f}
.cam-link .lk svg{height:12px;width:15px}
.cam-link .pl{color:var(--acc2)}
.linkbox{background:rgba(127,220,159,.07);border:1px solid rgba(127,220,159,.28);border-radius:7px;padding:9px 9px 2px;margin-bottom:8px}
.add-item{background:transparent;border-style:dashed;color:var(--muted);flex:1;padding:4px}
.add-item:hover{color:#fff;border-color:var(--acc)}
#addCam,#placeAll{width:100%;padding:9px;border-style:dashed;color:var(--muted)}
#addCam:hover,#placeAll:hover{color:#fff;border-color:var(--acc)}
/* library */
.lib{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.lib button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px 6px;font-size:11px;color:#cfcfd4;cursor:grab;white-space:normal;line-height:1.2;min-height:70px;text-align:center}
.lib button svg{height:34px;width:46px}
.libh{font-size:11px;color:var(--muted);margin:2px 0 6px}
/* layers */
#layers{max-height:240px;overflow-y:auto;border:1px solid var(--line);border-radius:6px}
.ly{display:grid;grid-template-columns:1fr 22px 22px;align-items:center;padding:3px 4px 3px 9px;border-bottom:1px solid #303034;font-size:12px;cursor:pointer;color:#cfcfd4}
.ly:last-child{border-bottom:0}
.ly.on{background:rgba(238,108,26,.18);color:#fff}
.ly.off{opacity:.45}
.ly span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ly .ib{font-size:11px}
.ly .ib.act{color:var(--acc2)}
.alignbar{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:8px}
.alignbar button{padding:4px 7px;font-size:12px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:50}
#modal.open{display:grid}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;width:min(520px,92vw);max-height:86vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.mbox h2{margin:0 0 14px;font-size:17px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--panel2)}
.opt:has(input:checked){border-color:var(--acc);background:rgba(238,108,26,.1)}
.opt input{margin-top:3px}
.opt b{display:block;margin-bottom:2px}
.opt small{color:var(--muted)}
.keys{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:5px 12px;font-size:12.5px}
.keys kbd{font:600 11.5px ui-monospace,Menlo,monospace;background:#1a1a1c;border:1px solid var(--line);border-radius:4px;padding:2px 6px;white-space:nowrap;justify-self:start;color:#fff}
.keys span{color:#cfcfd4}
.keys h4{grid-column:1/-1;margin:10px 0 2px;font-size:11px;color:var(--acc2);letter-spacing:.06em}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#111;border:1px solid var(--line);color:#fff;padding:9px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:60;font-size:13px}
#toast.show{opacity:1;transform:translateX(-50%)}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;place-items:center;z-index:70;color:#fff;font-weight:700}
#busy.on{display:grid}

.sheeth,#mnav,#selbar,#bMore{display:none}
#bMore{font-size:18px;line-height:1;padding:4px 10px}
html,body{overscroll-behavior:none}
/* large tablets / small laptops */
@media (min-width:1101px) and (max-width:1320px){#app{grid-template-columns:316px 46px 1fr 262px}.brand span{display:none}}
/* touch devices: bigger targets */
@media (pointer:coarse){
  input[type=text],input[type=number],textarea,select{font-size:16px}
  button{padding:7px 12px}
  .tool{width:42px;height:42px}
  .ib{padding:6px 8px;font-size:14px}
  .items li{margin-bottom:5px}
  .lib button{min-height:78px}
  .ly{padding:7px 4px 7px 10px}
  .tab{min-height:34px}
  input[type=range]{height:28px}
}
/* compact: phones + tablets up to 1100px → canvas first, panels as drawers */
@media (max-width:1100px),(pointer:coarse) and (max-width:1400px){
  #top{height:calc(50px + env(safe-area-inset-top));padding:env(safe-area-inset-top) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left))}
  #bZo,#bZi,#zoomv,#bGrid,#bHelp,.brand span{display:none}
  #bMore{display:inline-block}
  #app{top:calc(50px + env(safe-area-inset-top));display:block}
  #vp{position:absolute;left:0;right:0;top:0;bottom:calc(60px + env(safe-area-inset-bottom))}
  #tools{position:absolute;left:10px;top:46px;z-index:6;flex-direction:column;padding:5px;border-radius:12px;background:rgba(30,30,32,.94);border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.35)}
  #tools .k{display:none}
  #left,#right{position:fixed;z-index:20;display:none;border:1px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .sheeth{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:3;padding:12px 14px 10px;background:var(--panel);border-bottom:1px solid var(--line);font-size:14px}
  .sheeth .ib{font-size:16px;padding:6px 10px}
  body[data-sheet="list"] #left,body[data-sheet="settings"] #left{display:block}
  body[data-sheet="list"] #secDoc,body[data-sheet="list"] #secWm,body[data-sheet="settings"] #secCams{display:none}
  body[data-sheet="lib"] #right,body[data-sheet="insp"] #right,body[data-sheet="layers"] #right{display:block}
  body[data-sheet="lib"] #right>.sec:not(#secLib),body[data-sheet="insp"] #right>.sec:not(#inspSec),body[data-sheet="layers"] #right>.sec:not(#secLayers){display:none}
  #layers{max-height:none}
  #mnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;height:calc(60px + env(safe-area-inset-bottom));padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:#141415;border-top:1px solid var(--line)}
  #mnav button{flex:1;background:none;border:0;border-radius:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted);padding:0}
  #mnav button.on{color:var(--acc2)}
  #mnav svg{width:22px;height:22px}
  #selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));z-index:15;gap:4px;padding:5px;border-radius:14px;background:rgba(24,24,26,.96);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.45)}
  #selbar.on{display:flex}
  body[data-sheet]:not([data-sheet=""]) #selbar{display:none}
  #selbar button{padding:9px 13px;font-size:14px;background:transparent;border-color:transparent}
  #selbar .danger{color:#ff7b7b}
  .opt{padding:13px 14px}
}
/* tablets: side drawers, canvas stays visible */
@media (min-width:761px) and (max-width:1100px),(pointer:coarse) and (min-width:761px) and (max-width:1400px){
  #left{left:0;top:calc(50px + env(safe-area-inset-top));bottom:calc(60px + env(safe-area-inset-bottom));width:min(400px,46vw);border-left:0;border-radius:0 14px 14px 0}
  #right{right:0;top:calc(50px + env(safe-area-inset-top));bottom:calc(60px + env(safe-area-inset-bottom));width:min(340px,42vw);border-right:0;border-radius:14px 0 0 14px}
  body[data-sheet="list"] #tools,body[data-sheet="settings"] #tools{display:none}
}
/* phones: bottom sheets */
@media (max-width:760px){
  #bPlan,#bNew,#bOpen,#bSave,#bFit,.sep{display:none}
  .brand{margin-right:auto}
  #top button{padding:7px 11px}
  #left,#right{left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));max-height:62vh;border-radius:16px 16px 0 0;border-bottom:0}
  .lib{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
  .items li{grid-template-columns:16px 96px 1fr 30px}
  .cam-head{grid-template-columns:100px 1fr 104px}
  .mbox{padding:18px}
  #tools{flex-direction:row;top:44px;left:50%;transform:translateX(-50%);padding:4px;gap:2px}
  #tools .tsep,#tools [data-tool=hand],#tools [data-tool=zoom]{display:none}
  .tool{width:40px;height:38px}
  .keys{grid-template-columns:auto 1fr}
}

.seg{display:flex;background:#232325;border:1px solid var(--line);border-radius:8px;padding:2px;margin-right:8px;flex-shrink:0}
.seg button{border:0;background:transparent;padding:5px 13px;border-radius:6px;color:var(--muted);font-weight:600}
.seg button:hover{background:#333337;color:#fff}
.seg button.on{background:var(--acc);color:#fff}
#sheetView{position:absolute;top:34px;left:0;right:0;bottom:0;display:none;flex-direction:column;background:#fff;color:#222;z-index:3;font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
body[data-mode="sheet"] #sheetView{display:flex}
body[data-mode="sheet"] #tools,body[data-mode="sheet"] #right,body[data-mode="sheet"] #stage{display:none}
body[data-mode="sheet"] #app{grid-template-columns:372px 1fr}
body[data-mode="sheet"] #bPlan,body[data-mode="sheet"] #bZo,body[data-mode="sheet"] #bZi,body[data-mode="sheet"] #zoomv,body[data-mode="sheet"] #bFit,body[data-mode="sheet"] #bGrid{display:none}
body[data-mode="sheet"] #selbar{display:none!important}
.xl-rib{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:7px 10px;background:#f3f2f1;border-bottom:1px solid #d4d4d4}
.xg{display:flex;align-items:center;gap:3px;padding-right:10px;border-right:1px solid #d4d4d4}
.xg:last-child{border-right:0;margin-left:auto}
.xl-rib button{background:#fff;color:#222;border:1px solid #c8c8c8;border-radius:4px;padding:4px 9px;font-size:12.5px;font-family:inherit}
.xl-rib button:hover{background:#e6f2ea;border-color:#217346}
.xl-rib button.on{background:#cfe6d7;border-color:#217346}
.xl-rib .sw{width:22px;height:22px;padding:0;border-radius:3px}
.xl-rib .sw.none{background:#fff;color:#999;font-size:11px}
.xlab{font-size:12px;color:#555;margin:0 2px}
#xlRate{width:52px;background:#fff;color:#222;border:1px solid #c8c8c8;padding:3px 5px;font-size:12.5px}
#xlZoomV{font-size:12px;color:#444;min-width:38px;text-align:center}
.xedit{display:none}
.xl-fbar{display:flex;align-items:stretch;border-bottom:1px solid #d4d4d4;background:#fff;height:30px;flex-shrink:0}
#xlName{width:96px;border:0;border-right:1px solid #d4d4d4;text-align:center;color:#222;background:#fff;font-size:12.5px;border-radius:0;padding:0}
.xl-fx{display:grid;place-items:center;padding:0 10px;color:#777;font-style:italic;font-family:Georgia,serif;border-right:1px solid #d4d4d4;font-size:13px}
#xlFx{flex:1;border:0;background:#fff;color:#222;border-radius:0;font-size:13px;padding:0 8px;font-family:inherit}
#xlFx:focus,#xlName:focus{border-color:transparent;outline:none}
.xl-wrap{flex:1;overflow:auto;position:relative;background:#fff}
.xl-inner{position:relative;display:inline-block;min-width:100%}
table.xl{border-collapse:separate;border-spacing:0;table-layout:fixed;user-select:none;-webkit-user-select:none;font-size:13.5px}
.xl th{position:sticky;top:0;background:#f3f3f3;color:#555;font-weight:400;font-size:12px;height:23px;border-right:1px solid #d4d4d4;border-bottom:1px solid #bdbdbd;z-index:2;text-align:center;cursor:s-resize}
.xl th.on{background:#d3e8dc;color:#0e5c2f;font-weight:700;border-bottom:2px solid #217346}
.xl .rh{position:sticky;left:0;z-index:1;background:#f3f3f3;color:#555;font-size:12px;text-align:center;border-right:1px solid #bdbdbd;border-bottom:1px solid #d4d4d4;padding:0;cursor:e-resize}
.xl thead .rh{z-index:4;cursor:default}
.xl td.rh.on{background:#d3e8dc;color:#0e5c2f;font-weight:700;border-right:2px solid #217346}
.xl td{height:26px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#111;border-right:1px solid #e3e3e3;border-bottom:1px solid #e3e3e3;cursor:cell}
.xl td.bd{border-right:1px solid #7a7a7a;border-bottom:1px solid #7a7a7a}
.xl tr td.bd:nth-child(2){border-left:1px solid #7a7a7a}
.xl tbody tr:first-child td.bd{border-top:1px solid #7a7a7a}
.xl td.ttl{height:46px;font-size:22px;font-weight:700}
.xl td.cat{vertical-align:middle}
.xl td.err{color:#c00}
.rz{position:absolute;right:-4px;top:0;width:8px;height:100%;cursor:col-resize;z-index:3}
#xlSel{position:absolute;border:2px solid #217346;pointer-events:none;z-index:2;box-sizing:border-box}
#xlSel.multi{background:rgba(33,115,70,.10)}
#xlAct{position:absolute;pointer-events:none;z-index:2;box-sizing:border-box}
#xlSel.multi+#xlAct{background:#fff;mix-blend-mode:multiply;border:1px solid transparent}
#xlEd{position:absolute;z-index:6;opacity:0;pointer-events:none;resize:none;overflow:hidden;white-space:pre;border:2px solid #217346;border-radius:0;background:#fff;color:#111;font:13.5px 'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;padding:3px 5px;line-height:1.4;box-shadow:0 2px 8px rgba(0,0,0,.18);outline:none}
#xlEd.on{opacity:1;pointer-events:auto;height:auto!important;min-height:26px}

function doResize(o,s0,hid,p,e){

  const fc=e.altKey;let ax=fc?0:-hx*s0.w/2,ay=fc?0:-hy*s0.h/2,nw=s0.w,nh=s0.h;
  if(hx)nw=fc?2*Math.abs(qx):(qx-ax)*hx;if(hy)nh=fc?2*Math.abs(qy):(qy-ay)*hy;

});
camsEl.addEventListener('keydown',e=>{

const TN={rect:'사각형',ellipse:'원',line:'선',text:'텍스트',image:'이미지',symbol:'심볼'};
const mm=v=>r2(v/4);

const numF=(k,label,v,t='num',step=0.5)=>`<div class="fld"><span>${label}</span><input type="number" step="${step}" data-k="${k}" data-t="${t}" value="${t==='mm'?mm(v):r2(v)}"></div>`;
const rowNum=(k,label,v,step=0.5,min=0)=>`<div class="row"><label>${label}</label><input type="number" step="${step}" min="${min}" data-k="${k}" data-t="num" value="${r2(v)}"></div>`;
const fontSel=(k,v)=>`<select data-k="${k}" data-t="str">${Object.entries(FONT_NAMES).map(([f,n])=>`<option value="${f}"${v===f?' selected':''}>${n}</option>`).join('')}</select>`;
function buildInspector(){
  const objs=selObjs(),el=$('#insp');updSelbar();
  if(!objs.length){$('#inspTitle').textContent='속성';el.innerHTML=`<p class="hint" style="margin:0">오브젝트를 선택하면 여기서 크기·색상·라벨을 바꿀 수 있어요.<br><br>
    <b>카메라 라벨</b>은 왼쪽 장비 목록의 캠 이름·오퍼레이터와 자동으로 연동돼요. 캠 카드의 ‘＋ 평면도에 배치’로 바로 놓을 수 있습니다.</p>`;return}
  const o=objs[0],multi=objs.length>1;let h='';
  $('#inspTitle').textContent=multi?`${objs.length}개 선택됨`:(o.type==='symbol'?SYM[o.kind].name:TN[o.type]);
  if(multi){h+=`<div class="alignbar"><button data-al="l" title="왼쪽 정렬">⇤</button><button data-al="hc" title="가로 가운데">↔</button><button data-al="r" title="오른쪽 정렬">⇥</button><button data-al="t" title="위쪽 정렬">⤒</button><button data-al="vc" title="세로 가운데">↕</button><button data-al="b" title="아래쪽 정렬">⤓</button><button data-al="dh" title="가로 간격 균등">⋯</button><button data-al="dv" title="세로 간격 균등">⋮</button></div>`}
  if(!multi&&o.type!=='line'){
    if(o.type==='text')h+=`<div class="g2">${numF('x','X',o.x,'mm')}${numF('y','Y',o.y,'mm')}</div>`;
    else h+=`<div class="g2">${numF('x','X',o.x,'mm')}${numF('y','Y',o.y,'mm')}</div><div class="g2">${numF('w','W',o.w,'mm')}${numF('h','H',o.h,'mm')}</div>`;
    h+=`<div class="row"><label>회전 (°)</label><input type="number" step="1" data-k="rot" data-t="num" value="${r2(o.rot||0)}"></div>`;
  }
  if(o.type==='symbol'){
    const cat=SYM[o.kind].cat;
    if(!multi)h+=`<div class="row"><label>종류</label><select data-k="kind" data-t="kind">${Object.entries(SYM).filter(([,S])=>S.cat===cat).map(([k,S])=>`<option value="${k}"${k===o.kind?' selected':''}>${S.name}</option>`).join('')}</select></div>`;
    h+=colorF('color','색상',o.color,false);
    const lc=cat==='cam'&&!multi?camById(o.camId):null;
    if(cat==='cam'&&!multi){
      h+=`<div class="${lc?'linkbox':''}"><div class="row"><label>연결된 캠</label><select data-t="camlink"><option value="">연결 안 함</option>${doc.cams.map(c=>`<option value="${c.id}"${lc&&lc.id===c.id?' selected':''}>${esc(c.title||'(이름 없음)')}${c.operator?' · '+esc(c.operator):''}${linkedSyms(c.id).length&&!(lc&&lc.id===c.id)?' (배치됨)':''}</option>`).join('')}</select></div>`;
      if(lc){const al=autoLines(lc);
        h+=`<div class="row"><label>카메라</label>${camNoSel(lc,'data-t="camf" data-f="no"')}</div>
        <div class="row"><label>역할</label><input type="text" data-t="camf" data-f="role" value="${esc(lc.role)}" placeholder="${lc.no==='etc'?'캠 이름':'예: Main'}"></div>
        <div class="row"><label>오퍼레이터</label><input type="text" data-t="camf" data-f="operator" value="${esc(lc.operator)}" placeholder="이름"></div>
        <div class="row"><label>둘째 줄</label><input type="text" data-k="labelExtra" data-t="str" value="${esc(o.labelExtra||'')}" placeholder="${esc(al[1]||'비워두면 없음')}"></div>
        <p class="hint" style="margin:-2px 0 8px">🔗 왼쪽 장비 목록과 실시간 연동 — 어느 쪽에서 고쳐도 같이 바뀝니다.</p>`}
      h+=`</div>`;
    }
    if(!lc)h+=`<div class="row" style="align-items:start"><label style="padding-top:6px">라벨</label><textarea data-k="label" data-t="str" rows="2" placeholder="예: Cam 1 / 최우철">${esc(o.label)}</textarea></div>`;
    h+=`<div class="g2">${numF('ls','글자',o.ls||6.5,'num',0.5)}<div class="crow"><input type="color" data-k="lc" data-t="color" value="${o.lc||'#111111'}"><span class="hint">라벨 색</span></div></div>`;
  }
  if(o.type==='rect'||o.type==='ellipse'){
    h+=colorF('fill','채우기',o.fill,true)+colorF('stroke','선',o.stroke,true);
    h+=`<div class="g2">${numF('sw','선 두께',o.sw,'num',0.2)}${o.type==='rect'?numF('r','모서리',o.r||0,'num',1):'<div></div>'}</div>`;
    h+=`<div class="row" style="align-items:start"><label style="padding-top:6px">안쪽 글자</label><textarea data-k="text" data-t="str" rows="2" placeholder="예: LED, Drum">${esc(o.text)}</textarea></div>`;
    h+=`<div class="g2">${numF('ts','글자',o.ts,'num',0.5)}<div class="crow"><input type="color" data-k="tc" data-t="color" value="${o.tc}">${fontSel('font',o.font)}</div></div>`;
  }
  if(o.type==='line'){
    h+=colorF('stroke','선 색',o.stroke,false)+rowNum('sw','선 두께',o.sw,0.2,0.2);
    h+=`<div class="crow" style="margin-bottom:7px"><label><input type="checkbox" data-k="dash" data-t="bool"${o.dash?' checked':''}> 점선</label><label><input type="checkbox" data-k="arrow" data-t="bool"${o.arrow?' checked':''}> 화살표</label></div>`;

    h+=`<div class="row" style="align-items:start"><label style="padding-top:6px">내용</label><textarea data-k="text" data-t="str" rows="3">${esc(o.text)}</textarea></div>`;
    h+=`<div class="g2">${numF('size','크기',o.size,'num',0.5)}<div class="crow"><input type="color" data-k="color" data-t="color" value="${o.color}">${fontSel('font',o.font)}</div></div>`;
    h+=`<div class="g2"><select data-k="weight" data-t="num">${[[400,'보통'],[500,'중간'],[700,'굵게'],[900,'아주 굵게']].map(([w,n])=>`<option value="${w}"${+o.weight===w?' selected':''}>${n}</option>`).join('')}</select><select data-k="align" data-t="str">${[['left','왼쪽'],['center','가운데'],['right','오른쪽']].map(([a,n])=>`<option value="${a}"${o.align===a?' selected':''}>${n} 정렬</option>`).join('')}</select></div>`;
  }
  h+=`<div class="row"><label>불투명도</label><input type="range" min="0.05" max="1" step="0.05" data-k="opacity" data-t="num" value="${o.opacity??1}"></div>`;
  h+=`<div class="alignbar" style="margin:8px 0 0"><button data-cmd="front" title="맨 앞으로 (⇧⌘])">맨 앞</button><button data-cmd="fwd" title="앞으로 (⌘])">앞</button><button data-cmd="bwd" title="뒤로 (⌘[)">뒤</button><button data-cmd="back" title="맨 뒤로 (⇧⌘[)">맨 뒤</button><button data-cmd="dup" title="복제 (⌘D)">복제</button><button data-cmd="lock" title="잠금 (⌘2)">잠금</button><button data-cmd="del" title="삭제 (⌫)">삭제</button></div>`;
  el.innerHTML=h;
}
function applyField(el,final){
  const k=el.dataset.k,t=el.dataset.t;
  for(const o of selObjs()){
    if(t==='camlink'){if(!isCamSym(o))continue;if(el.value){o.camId=el.value;o.labelExtra=o.labelExtra||''}else{o.label=labelText(o);delete o.camId}continue}
    if(t==='camf'){const c=camById(o.camId);if(!c)continue;c[el.dataset.f]=el.value;if(el.dataset.f==='no'||el.dataset.f==='role')camTitle(c);const ci=doc.cams.indexOf(c);const li=camsEl.querySelector(`.cam[data-ci="${ci}"] [data-f="${el.dataset.f}"]`);if(li)li.value=el.value;break}
    if(!(k in o)&&!['r','ls','lc','opacity','rot','labelExtra'].includes(k))continue;
    if(t==='mm'){const v=parseFloat(el.value);if(isNaN(v))continue;let n=v*4;if(k==='w'||k==='h')n=Math.max(1,n);
      if(o.type==='symbol'&&(k==='w'||k==='h')){const r=o.w/o.h,cx=o.x+o.w/2,cy=o.y+o.h/2;if(k==='w'){o.w=n;o.h=n/r}else{o.h=n;o.w=n*r}o.x=cx-o.w/2;o.y=cy-o.h/2}else o[k]=n}
    else if(t==='num'){const v=parseFloat(el.value);if(!isNaN(v))o[k]=v}
    else if(t==='str')o[k]=el.value;
    else if(t==='bool')o[k]=el.checked;
    else if(t==='color'){o[k]=el.value;const nb=el.parentElement.querySelector('[data-t="none"]');if(nb)nb.checked=false}
    else if(t==='none'){o[k]=el.checked?'none':el.parentElement.querySelector('[data-t="color"]').value}
    else if(t==='kind'){const S=SYM[el.value],cx=o.x+o.w/2,cy=o.y+o.h/2;o.kind=el.value;o.h=o.w*S.vh/S.vw;o.x=cx-o.w/2;o.y=cy-o.h/2}
  }
}
const insp=$('#insp');
insp.addEventListener('input',e=>{const el=e.target;if(!el.dataset.t||el.dataset.t==='camlink')return;applyField(el);sched()});
insp.addEventListener('change',e=>{const el=e.target;if(!el.dataset.t)return;applyField(el,true);commit();render();

function objName(o){
  if(o.name)return o.name+(o.text&&o.name!==o.text?` · ${o.text}`:'');
  if(o.type==='symbol'){const t=labelText(o);return `${o.camId&&camById(o.camId)?'🔗 ':''}${SYM[o.kind].name}${t?' · '+t.split('\n')[0]:''}`}
  if(o.type==='text')return `“${String(o.text).split('\n')[0]}”`;
  return TN[o.type]+(o.text?' · '+o.text.split('\n')[0]:'');
}
function buildLayers(){
  const L=$('#layers');
  L.innerHTML=doc.objects.slice().reverse().map(o=>`<div class="ly${sel.has(o.id)?' on':''}${o.hidden?' off':''}" data-id="${o.id}"><span>${o.groupId?'▣ ':''}${esc(objName(o))}</span>
    <button class="ib${o.hidden?' act':''}" data-ly="hide" title="${o.hidden?'보이기':'숨기기'} (⌘3)">${o.hidden?'◌':'◉'}</button><button class="ib${o.locked?' act':''}" data-ly="lock" title="${o.locked?'잠금 해제':'잠금'} (⌘2)">${o.locked?'🔒':'🔓'}</button></div>`).join('')||'<p class="hint" style="padding:8px;margin:0">비어 있음</p>';
}
$('#layers').addEventListener('click',e=>{
  const row=e.target.closest('.ly');if(!row)return;const o=getObj(row.dataset.id);if(!o)return;const b=e.target.closest('[data-ly]');
  if(b){if(b.dataset.ly==='hide'){o.hidden=!o.hidden;if(o.hidden)sel.delete(o.id)}else{o.locked=!o.locked;if(o.locked)sel.delete(o.id)}commit();buildInspector();render();return}
  if(o.locked||o.hidden){toast('잠기거나 숨겨진 오브젝트예요');return}
  if(e.shiftKey){const s=new Set(sel);s.has(o.id)?s.delete(o.id):s.add(o.id);setSel(s)}else setSel(new Set([o.id]));

const XL_PROT=new Set(['cat','name','qty','price','total','disc']);
const XL_NUM=new Set(['qty','price','total','disc']);
const CAT_ORDER=['Switch','Body','Lens','Broadcast','Support','Power','ETC'];
const BRANDS=['Sony','Sigma','Tamron','Canon','Nikon','Panasonic','Fujifilm','BlackMagicDesign','Blackmagic','DJI','Tilta','SmallRig','Sachtler','Godox','Atomos','Accsoon','Hollyland','Zeiss','Samyang','Viltrox','Manfrotto','Kupo','Benq','Apple','Aputure','Nanlite','Rode','Sennheiser','Zhiyun','Feelworld','Lilliput','Insta360','GoPro','Teradek','SmallHD','Zeuslap','Lenovo','Tplink','Easyrig','Moza','Neewer','Ulanzi','Brennenstuhl','Saramonic','Shure'];
function splitBrand(t){const s=String(t).trim(),w=s.split(/\s+/)[0]||'';if(/^apple\s*box/i.test(s))return['',s];const b=BRANDS.find(x=>x.toLowerCase()===w.toLowerCase());return b?[b,s.slice(w.length).trim()||s]:['',s]}
function defSheet(){return{title:'',titleAuto:true,discRate:0.8,ignore:[],styles:{},rows:[],cols:[
  {key:'cat',label:'품목',w:96},{key:'brand',label:'브랜드',w:150},{key:'name',label:'장비명',w:250},{key:'qty',label:'수량',w:64},
  {key:'owner',label:'소유주',w:150},{key:'price',label:'장비렌탈가',w:104},{key:'total',label:'총액',w:104},{key:'disc',label:'학생할인가',w:104},{key:'note',label:'비고',w:210}]}}
function ensureSheet(d){
  if(!d.sheet)d.sheet=defSheet();const s=d.sheet,D=defSheet();
  for(const k of['title','titleAuto','discRate','ignore','styles','rows','cols'])if(s[k]===undefined)s[k]=D[k];
  for(const r of s.rows){r.m=r.m||{};r.x=r.x||{};for(const k of['cat','brand','name','qty','owner','price','note'])if(r[k]==null)r[k]=''}
  return d;
}
const xlNorm=t=>String(t).trim().toLowerCase().replace(/\s+/g,' ');
const xlTouched=r=>Object.keys(r.m||{}).length>0||!!(r.price||r.owner||r.note)||r.totalOv!=null||r.discOv!=null||Object.values(r.x||{}).some(v=>v!=='');
function xlPlace(s,r){
  const rows=s.rows;let last=-1;rows.forEach((x,i)=>{if(x.cat===r.cat)last=i});
  if(last>=0){rows.splice(last+1,0,r);return}
  const oi=c=>{const i=CAT_ORDER.indexOf(c);return i<0?CAT_ORDER.length-0.5:i};
  const idx=rows.findIndex(x=>oi(x.cat)>oi(r.cat));if(idx<0)rows.push(r);else rows.splice(idx,0,r);
}
function syncSheet(d){
  const s=ensureSheet(d).sheet,want=new Map();
  for(const c of d.cams)for(const it of c.items){const t=String(it.t||'').trim();if(!t)continue;const k=xlNorm(t);if(s.ignore.includes(k))continue;
    const w=want.get(k)||{t,count:0,cats:{}};w.count++;w.cats[it.c]=(w.cats[it.c]||0)+1;want.set(k,w)}
  const bySrc=new Map(s.rows.filter(r=>r.src).map(r=>[r.src,r]));
  const vanished=s.rows.filter(r=>r.src&&!want.has(r.src)),fresh=[...want.keys()].filter(k=>!bySrc.has(k));
  if(vanished.length===1&&fresh.length===1&&xlTouched(vanished[0])){const r=vanished[0];bySrc.delete(r.src);r.src=fresh[0];bySrc.set(r.src,r)}
  s.rows=s.rows.filter(r=>!(r.src&&!want.has(r.src)&&!xlTouched(r)));
  for(const r of s.rows)if(r.src&&!want.has(r.src))delete r.src;
  for(const[k,w]of want){
    const cat=Object.entries(w.cats).sort((a,b)=>b[1]-a[1])[0][0];let r=bySrc.get(k);
    if(!r){r={id:uid(),src:k,cat,brand:'',name:'',qty:'',owner:'',price:'',note:'',m:{},x:{}};xlPlace(s,r)}
    const[b,n]=splitBrand(w.t);
    if(!r.m.brand)r.brand=b;if(!r.m.name)r.name=n;if(!r.m.qty)r.qty=String(w.count);
    if(!r.m.cat&&r.cat!==cat){s.rows.splice(s.rows.indexOf(r),1);r.cat=cat;xlPlace(s,r)}
  }
}
const sheetTitle=d=>{const s=d.sheet;return s.titleAuto?`${String(d.title||'').replace(/\s*(촬영\s*)?조감도\s*\d*\s*$/,'').trim()||'새'} 장비 List`:s.title};

/* ---------- addressing ---------- */
const colL=c=>{let s='';c++;while(c>0){const m=(c-1)%26;s=String.fromCharCode(65+m)+s;c=Math.floor((c-1)/26)}return s};
const colI=L=>{let n=0;for(const ch of L.toUpperCase())n=n*26+ch.charCodeAt(0)-64;return n-1};
const XS=()=>doc.sheet;
const xlTR=()=>XS().rows.length+2;            // total row (display index, 0-based)
const xlNC=()=>XS().cols.length;
const xlCI=k=>XS().cols.findIndex(c=>c.key===k);
function xlRaw(r,c){
  const s=XS(),col=s.cols[c];if(!col)return'';const TR=xlTR();
  if(r===0)return c===0?(s.titleAuto?'':s.title):'';
  if(r===1)return col.label;
  if(r===TR){const ti=xlCI('total'),n=s.rows.length;
    if(col.key==='total'||col.key==='disc')return `=SUM(${colL(c)}3:${colL(c)}${n+2})`;
    return c===ti-1?'총액':''}
  const row=s.rows[r-2];if(!row)return'';
  if(col.key==='total')return row.totalOv!=null?row.totalOv:`=${colL(xlCI('qty'))}${r+1}*${colL(xlCI('price'))}${r+1}`;
  if(col.key==='disc')return row.discOv!=null?row.discOv:`=${colL(xlCI('total'))}${r+1}*${s.discRate}`;
  if(col.key in row&&col.key!=='x')return row[col.key];
  return row.x[col.key]??'';
}
/* ---------- formula engine ---------- */
let XC=new Map();const XCYC={};
const xlErr=c=>{const e=new Error(c);e.xl=c;throw e};
const isNumStr=v=>typeof v==='string'&&/^\s*-?(\d{1,3}(,\d{3})+|\d+)?(\.\d+)?\s*%?\s*$/.test(v)&&/\d/.test(v);
function xlNum(v){if(v===''||v==null)return 0;if(typeof v==='number')return v;if(typeof v==='boolean')return v?1:0;
  const s=String(v).replace(/,/g,'').trim(),pc=s.endsWith('%');const n=parseFloat(pc?s.slice(0,-1):s);return isNaN(n)?0:(pc?n/100:n)}
function xlVal(r,c){
  const key=r*4096+c;if(XC.has(key)){const v=XC.get(key);return v===XCYC?'#CIRC!':v}
  XC.set(key,XCYC);let v;try{v=xlCompute(r,c)}catch(e){v=e&&e.xl?e.xl:'#VALUE!'}XC.set(key,v);return v;
}
function xlEvalRaw(raw,numeric){
  if(typeof raw!=='string')return raw??'';
  if(raw.startsWith('=')&&raw.length>1)return xlFormula(raw.slice(1));
  if(numeric&&isNumStr(raw))return xlNum(raw);
  return raw;
}
function xlCompute(r,c){
  const s=XS(),col=s.cols[c];if(!col)return'';const TR=xlTR();
  if(r===0)return c===0?sheetTitle(doc):'';
  if(r===1)return col.label;
  if(r===TR){if(col.key==='total'||col.key==='disc'){let t=0;for(let i=2;i<TR;i++){const v=xlVal(i,c);if(typeof v==='number')t+=v}return t}
    return xlRaw(r,c)}
  const row=s.rows[r-2];
  if(col.key==='total'){if(row.totalOv!=null)return xlEvalRaw(row.totalOv,true);
    const p=xlVal(r,xlCI('price'));if(p===''||p==null)return'';const q=xlVal(r,xlCI('qty'));return(q===''?1:xlNum(q))*xlNum(p)}
  if(col.key==='disc'){if(row.discOv!=null)return xlEvalRaw(row.discOv,true);
    const t=xlVal(r,xlCI('total'));if(t===''||typeof t!=='number')return t===''?'':t;return Math.round(t*s.discRate)}
  return xlEvalRaw(xlRaw(r,c),XL_NUM.has(col.key));
}
function xlRef(c,r){if(r<0||c<0||r>xlTR()||c>=xlNC())return'';const v=xlVal(r,c);if(typeof v==='string'&&/^#[A-Z\/0!?]+!?$/.test(v)&&v.length<9)xlErr(v);return v}
function xlFn(fn,args){
  const flat=args.flat(),nums=flat.filter(v=>typeof v==='number'||isNumStr(v)).map(xlNum),sum=nums.reduce((a,b)=>a+b,0);
  switch(fn){
    case'SUM':return sum;case'AVERAGE':return nums.length?sum/nums.length:xlErr('#DIV/0!');
    case'MIN':return nums.length?Math.min(...nums):0;case'MAX':return nums.length?Math.max(...nums):0;
    case'COUNT':return nums.length;case'COUNTA':return flat.filter(v=>v!=='').length;case'PRODUCT':return nums.reduce((a,b)=>a*b,1);
    case'ROUND':{const p=10**xlNum(args[1]||0);return Math.round(xlNum(args[0])*p)/p}
    case'IF':return xlNum(args[0])?(args[1]??''):(args[2]??'');
  }
  xlErr('#NAME?');
}
function xlFormula(src){

function xlKey(e){

    if(k==='Enter'){e.preventDefault();xlCommitEdit();xlMove(e.shiftKey?-1:1,0);return}

    if(k==='Escape'){e.preventDefault();xlCancel();return}
    if(SH.edMode==='enter'&&k.startsWith('Arrow')){e.preventDefault();xlCommitEdit();xlMove(k==='ArrowUp'?-1:k==='ArrowDown'?1:0,k==='ArrowLeft'?-1:k==='ArrowRight'?1:0);return}
    return;
  }
  if(mod){
    if(c==='KeyC'||c==='KeyX'||c==='KeyV')return;
    const map={KeyZ:()=>e.shiftKey?redo():undo(),KeyY:redo,KeyB:xlBold,KeyA:()=>xlSelect(0,0,xlTR(),xlNC()-1),KeyD:xlFillDown,
      KeyI:()=>xlStyleSel(st=>(st.i=st.i?0:1,st)),Minus:xlDeleteRows,NumpadSubtract:xlDeleteRows,NumpadAdd:()=>xlInsertRows('above'),
      Equal:()=>{if(e.shiftKey)xlInsertRows('above')},Home:()=>xlSelect(0,0,0,0),End:()=>xlSelect(xlTR(),xlNC()-1,xlTR(),xlNC()-1)};
    if(k.startsWith('Arrow')){e.preventDefault();const TR=xlTR(),nC=xlNC();const cur={r:e.shiftKey?SH.fr:SH.ar,c:e.shiftKey?SH.fc:SH.ac};
      const t={ArrowUp:[0,cur.c],ArrowDown:[TR,cur.c],ArrowLeft:[cur.r,0],ArrowRight:[cur.r,nC-1]}[k];
      if(e.shiftKey){SH.fr=t[0];SH.fc=t[1]}else{SH.ar=SH.fr=t[0];SH.ac=SH.fc=t[1]}xlPlaceSel();renderSelHeaders();xlSyncBar();xlScrollTo();return}
    if(map[c]){e.preventDefault();map[c]()}return;
  }
  if(e.shiftKey&&c==='Space'){e.preventDefault();xlSelect(SH.ar,0,SH.fr,xlNC()-1);return}
  if(e.ctrlKey&&c==='Space'){e.preventDefault();xlSelect(0,SH.ac,xlTR(),SH.fc);return}
  const dirs={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]};

  if(k==='Enter'){e.preventDefault();xlMove(e.shiftKey?-1:1,0);return}

}

  const F=$('#xlFx');

      zin:()=>{SH.zoom=Math.min(2,+(SH.zoom+0.1).toFixed(2));renderSheet()},zout:()=>{SH.zoom=Math.max(0.5,+(SH.zoom-0.1).toFixed(2));renderSheet()},

    else({above:()=>xlInsertRows('above'),below:()=>xlInsertRows('below'),delrow:xlDeleteRows,left:()=>xlInsertCol('left'),right:()=>xlInsertCol('right'),delcol:xlDeleteCol,clear:xlClear}[a])();

function setMode(m){
  if(SH.editing)xlCommitEdit();
  mode=m;document.body.dataset.mode=m;tabsKey='';renderTabs();
  document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));

/* ---------- export ---------- */
function sheetCanvases(orient,k,single){
  XC=new Map();XR=catRuns();
  const s=XS(),cols=s.cols,TR=xlTR(),land=orient==='land',pw=land?1123:794,ph=land?794:1123,M=34;
  const sumW=cols.reduce((a,c)=>a+c.w,0),f=Math.min(1.15,(pw-2*M)/sumW),W=sumW*f,x0=(pw-W)/2,RH=26*f,TH=46*f;
  const xs=[];let acc=x0;for(const c of cols){xs.push(acc);acc+=c.w*f}
  const pages=[];let cur={rows:[],y:M};
  for(let r=0;r<=TR;r++){const h=r===0?TH:RH;
    if(!single&&cur.y+h>ph-M&&cur.rows.length>2){pages.push(cur);cur={rows:[{r:1,y:M}],y:M+RH}}
    cur.rows.push({r,y:cur.y});cur.y+=h}
  pages.push(cur);
  const FONT="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif",ci=xlCI('cat');
  return pages.map(pg=>{
    const H=single?pg.y+M:ph,cv=document.createElement('canvas');cv.width=Math.round(pw*k);cv.height=Math.round(H*k);
    const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.scale(k,k);
    const cellBox=(x,y,w,h,txt,st,size)=>{
      if(st.fill&&st.fill!=='none'){ctx.fillStyle=st.fill;ctx.fillRect(x,y,w,h)}
      ctx.strokeStyle='#000';ctx.lineWidth=0.6;ctx.strokeRect(x,y,w,h);
      if(txt===''||txt==null)return;ctx.save();ctx.beginPath();ctx.rect(x+1,y,w-2,h);ctx.clip();
      ctx.font=`${st.i?'italic ':''}${st.b?700:400} ${size}px ${FONT}`;ctx.fillStyle=st.fc||'#111';ctx.textBaseline='middle';
      const pad=5*f;if(st.al==='c'){ctx.textAlign='center';ctx.fillText(txt,x+w/2,y+h/2)}else if(st.al==='r'){ctx.textAlign='right';ctx.fillText(txt,x+w-pad,y+h/2)}else{ctx.textAlign='left';ctx.fillText(txt,x+pad,y+h/2)}
      ctx.restore()};
    const list=pg.rows;
    for(let i=0;i<list.length;i++){const{r,y}=list[i];
      if(r===0){cellBox(x0,y,W,TH,xlDisp(0,0),xlStyle(0,0),22*f);continue}
      for(let c=0;c<cols.length;c++){
        if(c===ci&&r>=2&&r<TR){const st0=XR.start.get(r);if(st0!==undefined&&st0!==r&&i>0&&list[i-1].r===r-1)continue;
          let n=1;while(i+n<list.length&&list[i+n].r===r+n&&list[i+n].r<TR&&XR.start.get(list[i+n].r)===st0)n++;
          cellBox(xs[c],y,cols[c].w*f,RH*n,xlDisp(r,c),xlStyle(r,c),13*f);continue}
        cellBox(xs[c],y,cols[c].w*f,RH,xlDisp(r,c),xlStyle(r,c),13*f)}
    }
    return cv;
  });
}
function makePDFPages(imgs,W,H){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const add=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};
  const obj=(n,body)=>{offs[n]=len;add(`${n} 0 obj\n${body}\nendobj\n`)};
  add('%PDF-1.4\n');add(new Uint8Array([37,226,227,207,211,10]));
  const n=imgs.length,kids=imgs.map((_,i)=>`${3+i*3} 0 R`).join(' ');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,`<< /Type /Pages /Kids [${kids}] /Count ${n} >>`);
  imgs.forEach((im,i)=>{const p=3+i*3;
    obj(p,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 ${p+1} 0 R >> >> /Contents ${p+2} 0 R >>`);
    offs[p+1]=len;add(`${p+1} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`);add(im.bytes);add('\nendstream\nendobj\n');
    const cs=`q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;obj(p+2,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`)});
  const total=3+n*3,xr=len;let x=`xref\n0 ${total}\n0000000000 65535 f \n`;for(let i=1;i<total;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  add(x);add(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF\n`);
  return new Blob(parts,{type:'application/pdf'});
}
function sheetCSV(){
  XC=new Map();const rows=[];
  for(let r=0;r<=xlTR();r++){const a=[];for(let c=0;c<xlNC();c++){const v=r===0&&c>0?'':xlVal(r,c);a.push(typeof v==='number'?String(v):String(v??''))}rows.push(a)}
  return'﻿'+rows.map(a=>a.map(v=>/[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v).join(',')).join('\r\n');
}
async function exportSheet(fmt,orient,x){
  ensureSheet(doc);const name=safeName(sheetTitle(doc));
  if(fmt==='csv')return saveFile(name+'.csv',new Blob([sheetCSV()],{type:'text/csv'}));
  if(fmt==='pdf'){const cvs=sheetCanvases(orient,3508/1123,false);
    const imgs=[];for(const c of cvs){const b=await toBlob(c,'image/jpeg',0.92);imgs.push({bytes:new Uint8Array(await b.arrayBuffer()),w:c.width,h:c.height})}
    const land=orient==='land';return saveFile(name+'.pdf',makePDFPages(imgs,land?841.89:595.28,land?595.28:841.89))}
  const[c]=sheetCanvases(orient,x,true);const b=await toBlob(c,'image/jpeg',0.93);return saveFile(`${name}${x>1?'@x'+x:''}.jpg`,b);
}

/* ================= boot ================= */
(function boot(){
  resetAssets();
  // previous session: unsaved docs go to recovery; app always starts with a fresh document
  try{
    let prev=null;const v2=localStorage.getItem('vision-jodo-v2'),v1=localStorage.getItem('vision-jodo-v1');
    if(v2){const p=JSON.parse(v2);prev={docs:(p.tabs||[]).filter(t=>t.dirty).map(t=>t.doc),assets:p.assets||{}}}
    else if(v1){const p=JSON.parse(v1);prev={docs:[p.doc],assets:p.assets||{}}}
    if(prev&&prev.docs.length)localStorage.setItem('vision-jodo-recover',JSON.stringify(prev));
    if(v1)localStorage.removeItem('vision-jodo-v1');
    const r=localStorage.getItem('vision-jodo-recover');if(r){recover=JSON.parse(r);if(!recover.docs||!recover.docs.length)recover=null}
  }catch(e){recover=null}
  buildLib();setTool('select');xlWire();document.body.dataset.mode='plan';
  tabs=[mkTab(blankDoc(),true)];activate(0);autosave();
  ensureFonts().then(sched);
})();
